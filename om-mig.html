<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Om mig | LÄBO</title>
    <!-- Länka till SAMMA CSS-fil -->
    <link href="src/output.css" rel="stylesheet">

<!-- Body-taggen för UNDERSIDOR -->
<body class="undersida bg-orange-50">

    <!-- ===== HEADER ===== -->
    <!-- Detta är exakt samma header-kod som på startsidan -->
    <header class="sticky top-0 z-50 p-4 bg-orange-100 text-orange-950 border-b border-gray-200">
        <div class="container flex justify-between h-16 mx-auto">
            <!-- Logotyp -->
            <a rel="noopener noreferrer" href="index.html" aria-label="Back to homepage" class="flex items-center p-2">
                <svg class="h-10 w-auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 298.32 127.28">
                    <g isolation="isolate">
                        <g id="Header_Linjer_LaBO" data-name="Header_Linjer LaBO"><g><line x1="150.91" x2="150.91" y2="119.7"/><line x1="125.72" y1="56.92" x2="125.72" y2="119.7"/><line x1="125.27" y1="40.58" x2="73.12" y2="40.58"/><line x1="15.83" y1="7.58" x2="15.83" y2="122.61"/><line x1="62.78" y1="116.8" x2="10.13" y2="116.8"/></g></g>
                        <g id="Header_cirkel_O" data-name="cirkel O"><circle cx="254.69" cy="88.97" r="30.98"/></g>
                        <g id="Header_cirkel_B" data-name="cirkel B"><circle cx="176.69" cy="88.97" r="30.98"/></g>
                        <g id="Header_cirkel_A" data-name="cirkel A"><circle cx="98.69" cy="88.97" r="30.98"/></g>
                    </g>
                </svg>
            </a>
            <!-- Meny för Dator -->
            <ul class="items-stretch hidden space-x-3 md:flex">
                <li class="flex"><a rel="noopener noreferrer" href="om-mig.html" class="flex items-center px-4 -mb-1 border-b-2 border-transparent desktop-menu-link menu-link-active"><span>Om Mig</span></a></li>
                <li class="flex"><a rel="noopener noreferrer" href="portfolio.html" class="flex items-center px-4 -mb-1 border-b-2 border-transparent desktop-menu-link">Portfolio</a></li>
                <li class="flex"><a rel="noopener noreferrer" href="#" class="flex items-center px-4 -mb-1 border-b-2 border-transparent desktop-menu-link">Tjänster</a></li>
                <li class="flex"><a rel="noopener noreferrer" href="#" class="flex items-center px-4 -mb-1 border-b-2 border-transparent desktop-menu-link">Kontakt</a></li>
            </ul>
            <!-- Hamburgarknapp för Mobil -->
            <button id="hamburger-button" class="flex justify-end p-4 md:hidden">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
        <!-- Rullgardinsmeny för Mobil -->
        <div id="mobile-menu" class="hidden md:hidden absolute top-full right-0 mt-2 w-56 bg-orange-50 border-b border-gray-200">
            <ul class="flex flex-col p-2">
                <li><a href="om-mig.html" class="block py-2 px-4 text-lg mobile-menu-link">Om mig</a></li>
                <li><a href="portfolio.html" class="block py-2 px-4 text-lg mobile-menu-link">Portfolio</a></li>
                <li><a href="#" class="block py-2 px-4 text-lg mobile-menu-link">Tjänster</a></li>
                <li><a href="#" class="block py-2 px-4 text-lg mobile-menu-link">Kontakt</a></li>
            </ul>
        </div>
    </header>

    <!-- ===== HUVUDINNEHÅLL (MAIN) ===== -->
    <main>
        <section class="py-12 px-4 md:px-8 lg:px-16">
            <div class="container mx-auto">
                <div class="grid md:grid-cols-2 gap-12 items-center">
                    <!-- Vänster kolumn: Bild -->
                    <div class="w-full">
                        <div class="bg-orange-200 rounded-lg h-96 w-full flex items-center justify-center">
                            <span class="text-orange-500">Din profilbild här</span>
                        </div>
                    </div>
                    <!-- Höger kolumn: Text -->
                    <div class="text-orange-950">
                        <h1 class="text-4xl font-bold mb-4">Om LÄBO Arkitektur</h1>
                        <p class="text-xl text-orange-800 mb-6">En passionerad studio med ett öga för detaljer.</p>
                        <p class="mb-4">Här kan du skriva lite mer om din bakgrund...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // Script för hamburgarmeny (behövs på alla sidor)
        const hamburgerButton = document.getElementById('hamburger-button');
        const mobileMenu = document.getElementById('mobile-menu');
        if (hamburgerButton && mobileMenu) {
            hamburgerButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    </script>
</body>
